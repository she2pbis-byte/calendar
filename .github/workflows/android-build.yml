on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Создаем базовый package.json в корне проекта
    - name: Create Package JSON
      run: |
        echo '{"name": "staffcloud-app", "version": "1.0.0", "dependencies": {}}' > package.json

    # 4. Устанавливаем стабильную версию Capacitor
    - name: Install Capacitor
      run: |
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

    # 5. Инициализируем конфигурацию, указывая вашу папку www
    - name: Init Capacitor Config
      run: |
        npx cap init "StaffCloud" "com.staffcloud.shiftcalendar" --web-dir=www

    # 6. Добавляем и синхронизируем платформу Android
    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    # НОВЫЙ ШАГ: Принудительное изменение названия приложения на экране Android под иконкой
    - name: Force Change App Name to "Календарь Смен"
      run: |
        echo "Меняем название приложения в strings.xml..."
        sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Календарь Смен<\/string>/g' android/app/src/main/res/values/strings.xml
        
        echo "Проверяем результат изменения:"
        cat android/app/src/main/res/values/strings.xml

    # 7. Настраиваем Java 17 для компиляции в APK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 8. Компилируем проект в APK файл
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 9. Изолируем готовый файл APK отдельно
    - name: Isolate APK File
      run: |
        mkdir -p final_apk
        cp android/app/build/outputs/apk/debug/app-debug.apk ./final_apk/StaffCloud.apk

    # 10. Публикуем ЕДИНСТВЕННЫЙ файл в Релизы на главную страницу репозитория
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Сборка №${{ github.run_number }}
        files: ./final_apk/StaffCloud.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
