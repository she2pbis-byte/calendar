on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Полная очистка нативных папок для предотвращения старых конфликтов
    - name: Clean Old Android Folder
      run: |
        echo "Удаляем старые нативные папки для чистой сборки..."
        rm -rf android
        rm -rf ios

    # 4. Устанавливаем зависимости из сохраненного package.json
    - name: Install Dependencies
      run: |
        npm install

    # 5. Устанавливаем генератор ресурсов (если необходим)
    - name: Install Assets Generator
      run: |
        npm install @capacitor/assets --save-dev

    # 6. Добавляем платформу Android
    - name: Add Android Platform
      run: |
        npx cap add android

    # 7. Автоматическое инжектирование разрешений в AndroidManifest.xml
    - name: Inject Android Storage Permissions
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          echo "Файл манифеста найден. Добавляем разрешения на чтение и запись..."
          
          # Добавляем разрешения перед закрывающим тегом </manifest>
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_PATH
          
          # Включаем legacy-доступ к хранилищу в тег <application>
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/g' $MANIFEST_PATH
          
          echo "Модификация манифеста успешно завершена."
        else
          echo "КРИТИЧЕСКАЯ ОШИБКА: AndroidManifest.xml не найден!"
          exit 1
        fi

    # 8. Генерация иконок из assets/icon.png
    - name: Generate App Icons
      run: |
        if [ -f "assets/icon.png" ]; then
          echo "Иконка найдена! Генерируем ресурсы..."
          npx capacitor-assets generate --android
        else
          echo "ВНИМАНИЕ: Файл assets/icon.png не найден!"
        fi

    # 9. Синхронизируем веб-код и ресурсы в Android проект
    - name: Sync Capacitor
      run: |
        npx cap sync android

    # 10. Генерируем СТАБИЛЬНЫЙ постоянный файл подписи Release Keystore
    - name: Generate Permanent Release Keystore
      run: |
        echo "Генерируем фиксированный файл подписи для приложения..."
        keytool -genkey -v -keystore android/app/release-key.jks -alias staffcloudkey -keyalg RSA -keysize 2048 -validity 10000 -storepass staffcloud123 -keypass staffcloud123 -dname "CN=StaffCloud,O=StaffCloud,C=RU"

    # 11. Настраиваем build.gradle для автоматического использования созданной подписи
    - name: Configure Gradle Signing
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let content = fs.readFileSync(path, 'utf8');

          const signingConfigs = `
              signingConfigs {
                  release {
                      storeFile file('release-key.jks')
                      storePassword 'staffcloud123'
                      keyAlias 'staffcloudkey'
                      keyPassword 'staffcloud123'
                  }
              }
          `;

          const androidIndex = content.indexOf('android {');
          if (androidIndex !== -1) {
              content = content.substring(0, androidIndex + 9) + signingConfigs + content.substring(androidIndex + 9);
          }

          const buildTypesIndex = content.indexOf('buildTypes {');
          if (buildTypesIndex !== -1) {
              let buildTypesSection = content.substring(buildTypesIndex);
              buildTypesSection = buildTypesSection.replace(/(release\s*\{)/, "$1\n            signingConfig signingConfigs.release");
              buildTypesSection = buildTypesSection.replace(/(debug\s*\{)/, "$1\n            signingConfig signingConfigs.release");
              content = content.substring(0, buildTypesIndex) + buildTypesSection;
          }

          fs.writeFileSync(path, content, 'utf8');
          console.log("build.gradle успешно и безопасно сконфигурирован.");

    # 12. Настраиваем Java 17 для компиляции
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 13. Компилируем подписанный релизный APK-файл
    - name: Build Release APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    # 14. Изолируем готовый подписанный файл APK отдельно
    - name: Isolate APK File
      run: |
        mkdir -p final_apk
        cp android/app/build/outputs/apk/release/app-release.apk ./final_apk/StaffCloud.apk

    # 15. Публикуем ЕДИНСТВЕННЫЙ файл в Релизы репозитория
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: final_apk/StaffCloud.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
