on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. [НОВЫЙ ШАГ] Полная очистка нативных папок
    # Если папка android случайно попала в репозиторий, мы её удаляем, чтобы собрать проект начисто
    - name: Clean Old Android Folder
      run: |
        echo "Удаляем старые нативные папки для чистой сборки..."
        rm -rf android
        rm -rf ios

    # 4. Создаем ЧИСТЫЙ package.json в корне сборки
    - name: Create Package JSON
      run: |
        echo '{"name": "staffcloud-app", "version": "1.0.0", "dependencies": {}}' > package.json

    # 5. Устанавливаем стабильную версию Capacitor и генератор ресурсов
    - name: Install Capacitor & Assets Generator
      run: |
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        npm install @capacitor/assets --save-dev

    # 6. Инициализируем конфигурацию ЖЕСТКИМ указанием правильного имени и ID
    - name: Init Capacitor Config
      run: |
        npx cap init "Календарь Смен" "com.staffcloud.shiftcalendar" --web-dir=www

    # 7. Добавляем платформу Android с нуля
    - name: Add Android Platform
      run: |
        npx cap add android

    # 8. ГЕНЕРАЦИЯ ИКОНОК (Выполняется СТРОГО ДО синхронизации, чтобы Capacitor подтянул новые картинки)
    - name: Generate App Icons
      run: |
        if [ -f "assets/icon.png" ]; then
          echo "Иконка найдена! Генерируем ресурсы..."
          npx capacitor-assets generate --android
        else
          echo "ВНИМАНИЕ: Файл assets/icon.png не найден в репозитории!"
        fi

    # 9. Синхронизируем веб-код и ресурсы в Android проект
    - name: Sync Capacitor
      run: |
        npx cap sync android

    # 10. Точечное обновление версий в build.gradle для работы обновлений поверх
    - name: Force Update Android Version
      run: |
        echo "Принудительно обновляем версии в build.gradle..."
        sed -i -E 's/versionCode\s+[0-9]+/versionCode ${{ github.run_number }}/g' android/app/build.gradle
        sed -i -E 's/versionName\s+"[0-9.]*"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

    # 11. Генерируем НАДЕЖНЫЙ СТАБИЛЬНЫЙ ключ подписи
    - name: Generate Consistent Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 12. Настраиваем Java 17 для компиляции в APK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 13. Компилируем проект в APK файл
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 14. Изолируем готовый файл APK отдельно
    - name: Isolate APK File
      run: |
        mkdir -p final_apk
        cp android/app/build/outputs/apk/debug/app-debug.apk ./final_apk/StaffCloud.apk

    # 15. Публикуем ЕДИНСТВЕННЫЙ файл в Релизы
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Сборка №${{ github.run_number }}
        files: ./final_apk/StaffCloud.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
