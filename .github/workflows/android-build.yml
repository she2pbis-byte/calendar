on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Создаем базовый package.json в корне проекта
    - name: Create Package JSON
      run: |
        echo '{"name": "staffcloud-app", "version": "1.0.0", "dependencies": {}}' > package.json

    # 4. Устанавливаем стабильную версию Capacitor и генератор ресурсов
    - name: Install Capacitor & Assets Generator
      run: |
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        npm install @capacitor/assets --save-dev

    # 5. Инициализируем конфигурацию, указывая вашу папку www
    - name: Init Capacitor Config
      run: |
        npx cap init "StaffCloud" "com.staffcloud.shiftcalendar" --web-dir=www

    # 6. Добавляем и синхронизируем платформу Android
    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    # 7. ГЕНЕРАЦИЯ ИКОНОК
    - name: Generate App Icons
      run: |
        echo "Проверяем наличие исходной иконки..."
        if [ -f "assets/icon.png" ]; then
          echo "Иконка найдена! Запускаем генерацию ресурсов Android..."
          npx capacitor-assets generate --android
        else
          echo "Предупреждение: Файл assets/icon.png не найден."
        fi

    # 8. КОРРЕКЦИЯ ИМЕНИ И ВЕРСИЙ (Выполняется ПОСЛЕ генератора иконок)
    - name: Absolute Hardcode Name and Version
      run: |
        echo "1. Вычищаем 'StaffCloud' из ВСЕХ текстовых и XML файлов в исходниках Android..."
        # Ищем абсолютно все файлы в папке ресурсов приложения и принудительно заменяем имя
        find android/app/src/main/ -type f -exec sed -i 's/StaffCloud/Календарь Смен/g' {} +
        
        echo "2. Принудительно прописываем versionCode и versionName в build.gradle..."
        sed -i -E 's/versionCode\s+[0-9]+/versionCode ${{ github.run_number }}/g' android/app/build.gradle
        sed -i -E 's/versionName\s+"[0-9.]*"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle
        
        echo "--- ПРОВЕРКА РЕЗУЛЬТАТОВ СБОРКИ ---"
        echo "Проверяем имя в strings.xml:"
        cat android/app/src/main/res/values/strings.xml | grep -E "app_name|Календарь" || true
        echo "Проверяем версии в build.gradle:"
        grep -E "versionCode|versionName" android/app/build.gradle

    # 9. Генерируем НАДЕЖНЫЙ СТАБИЛЬНЫЙ ключ подписи
    - name: Generate Consistent Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 10. Настраиваем Java 17 для компиляции в APK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 11. Компилируем проект в APK файл
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 12. Изолируем готовый файл APK отдельно
    - name: Isolate APK File
      run: |
        mkdir -p final_apk
        cp android/app/build/outputs/apk/debug/app-debug.apk ./final_apk/StaffCloud.apk

    # 13. Публикуем ЕДИНСТВЕННЫЙ файл в Релизы
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Сборка №${{ github.run_number }}
        files: ./final_apk/StaffCloud.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
