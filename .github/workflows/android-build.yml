on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория (включая ваши конфигурационные файлы)
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Устанавливаем Capacitor НАПРЯМУЮ (БЕЗ перезаписи вашего package.json)
    - name: Install Capacitor Core & CLI
      run: |
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        npm install @capacitor/assets --save-dev

    # 4. Добавляем платформу Android (Capacitor считает имя "Календарь Смен" из вашего файла конфигурации)
    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    # 5. ГЕНЕРАЦИЯ ИКОНОК
    - name: Generate App Icons
      run: |
        if [ -f "assets/icon.png" ]; then
          echo "Иконка найдена! Генерируем ресурсы..."
          npx capacitor-assets generate --android
        fi

    # 6. ЖЕСТКАЯ КОРРЕКЦИЯ (Для подстраховки: если утилита иконок или плагин попытаются сбросить имя)
    - name: Safe Name and Version Hardcode
      run: |
        echo "1. Принудительно проверяем/меняем название в strings.xml..."
        find android/app/src/main/res/values* -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Календарь Смен<\/string>/g' {} +
        
        echo "2. Принудительно прописываем versionCode и versionName в build.gradle..."
        sed -i -E 's/versionCode\s+[0-9]+/versionCode ${{ github.run_number }}/g' android/app/build.gradle
        sed -i -E 's/versionName\s+"[0-9.]*"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

    # 7. Генерируем стабильный ключ подписи (Чтобы подписи всегда совпадали)
    - name: Generate Consistent Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 8. Настраиваем Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 9. Компилируем проект в APK файл
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 10. Изолируем готовый файл APK отдельно
    - name: Isolate APK File
      run: |
        mkdir -p final_apk
        cp android/app/build/outputs/apk/debug/app-debug.apk ./final_apk/StaffCloud.apk

    # 11. Публикуем в Релизы
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Сборка №${{ github.run_number }}
        files: ./final_apk/StaffCloud.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
