name: Build Android App (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Склонировать репозиторий с кодом
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Настроить Node.js окружение
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-index: '20'

    # 3. Установить зависимости Capacitor
    - name: Install Dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    # 4. Инициализация и сборка Android платформы
    - name: Initialize Capacitor Android
      run: |
        npx cap init "Календарь Смен" "com.staffcloud.shiftcalendar" --web-dir=.
        npx cap add android
        npx cap sync android

    # 5. Настройка Java для Android SDK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 6. Сборка цифрового пакета Gradle (Неподписанный APK для тестирования)
    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 7. Сохранение готового файла APK в артефакты GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shift-calendar-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

