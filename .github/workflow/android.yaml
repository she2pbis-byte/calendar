name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Жестко создаем package.json, чтобы у Capacitor не было вопросов
    - name: Create Package JSON
      run: |
        echo '{"name": "staffcloud-app", "version": "1.0.0", "dependencies": {}}' > package.json

    # 4. Устанавливаем Capacitor
    - name: Install Capacitor
      run: |
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

    # 5. Инициализируем конфигурацию (указываем текущую папку "." как источник веб-файлов)
    - name: Init Capacitor Config
      run: |
        npx cap init "StaffCloud" "com.staffcloud.shiftcalendar" --web-dir=. --noprompts

    # 6. Добавляем платформу Android
    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    # 7. Настраиваем Java для компиляции
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 8. Собираем APK и жестко проверяем, что он создался
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Проверяем, появился ли файл. Если нет — сборка прервется здесь с ошибкой
        ls -la app/build/outputs/apk/debug/

    # 9. Изолируем ТОЛЬКО ОДИН файл в отдельную чистую папку
    - name: Isolate APK File
      run: |
        mkdir -p output_apk
        cp android/app/build/outputs/apk/debug/app-debug.apk ./output_apk/StaffCloud.apk

    # 10. Отправляем в артефакты СТРОГО содержимое этой папки
    - name: Upload Single APK
      uses: actions/upload-artifact@v4
      with:
        name: StaffCloud-Package
        path: ./output_apk/StaffCloud.apk
        if-no-files-found: error
