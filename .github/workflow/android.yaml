name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Capacitor & Dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "StaffCloud" "com.staffcloud.shiftcalendar" --web-dir=. --noprompts

    - name: Add and Sync Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # Собираем приложение
    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # Очищаем путь: копируем только готовый APK в корень и даем ему понятное имя
    - name: Prepare Single APK File
      run: |
        mkdir -p build-output
        cp android/app/build/outputs/apk/debug/app-debug.apk ./build-output/StaffCloud-Calendar.apk

    # Загружаем строго один конкретный файл
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: StaffCloud-Android-App
        path: ./build-output/StaffCloud-Calendar.apk
        retention-days: 7
